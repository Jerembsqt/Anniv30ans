<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F0A26">
<title>Mission : les 30 ans de Manon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1F0A26;
  --velvet:#4B1E5E;
  --champagne:#F4DDA4;
  --pink:#FF5C93;
  --ivory:#FFF6E8;
  --mist:#CDB8D3;
  --line:rgba(244,221,164,.28);
  --error:#FF9DBA;
  --display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --wink:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--night);color:var(--ivory);
  font-family:var(--display);font-size:18px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.backdrop{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(120% 60% at 50% -10%, var(--velvet) 0%, transparent 62%),
    radial-gradient(80% 50% at 100% 100%, rgba(255,92,147,.16) 0%, transparent 60%),
    var(--night);
}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-top)}

/* Progression */
.progress{
  position:fixed;top:var(--safe-top);left:0;right:0;height:5px;z-index:5;
  background:rgba(255,246,232,.1);opacity:0;transition:opacity .3s;
}
.progress.on{opacity:1}
.progress i{
  display:block;height:100%;width:0;border-radius:0 5px 5px 0;
  background:linear-gradient(90deg,var(--champagne),var(--pink));
  box-shadow:0 0 14px rgba(255,92,147,.7);
  transition:width .55s cubic-bezier(.2,.8,.2,1);
}

/* Scène */
.stage{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  width:100%;max-width:560px;margin:0 auto;padding:44px 24px 20px;
}
.screen{animation:in-next .42s cubic-bezier(.2,.8,.2,1) both}
.screen.back{animation-name:in-prev}
@keyframes in-next{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes in-prev{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* Accueil */
.big30{
  margin:0 0 .12em -.04em;
  font-weight:800;font-stretch:75%;
  font-size:clamp(150px,46vw,250px);line-height:.8;letter-spacing:-.04em;
  color:var(--champagne);text-shadow:6px 6px 0 var(--pink);
  user-select:none;
}
.welcome h1{
  margin:0 0 .6em;font-size:clamp(26px,6.4vw,34px);font-weight:700;font-stretch:90%;
  line-height:1.1;letter-spacing:-.01em;
}
.welcome p{margin:0 0 .7em;color:var(--ivory);max-width:34em}
.welcome .secret{
  font-family:var(--wink);font-style:italic;font-size:27px;line-height:1.15;
  color:var(--champagne);margin:.9em 0 1.3em;
}

/* Questions */
.q{
  margin:0 0 .45em;font-weight:700;font-stretch:88%;
  font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-.015em;
  text-wrap:balance;
}
.wink{
  margin:0 0 1.1em;font-family:var(--wink);font-style:italic;
  font-size:23px;line-height:1.25;color:var(--champagne);
}
.sentence{
  margin:0 0 .6em;font-family:var(--wink);font-style:italic;
  font-size:clamp(28px,7.4vw,36px);line-height:1.12;color:var(--champagne);
}
.tag{
  display:inline-block;margin:0 0 1.1em;padding:3px 12px;border-radius:999px;
  font-size:14px;color:var(--mist);border:1px solid var(--line);
}
.field{display:block;margin:0 0 22px}
.field>.lbl{display:block;font-size:15px;color:var(--mist);margin-bottom:8px}
.input,.textarea{
  display:block;width:100%;font:inherit;font-size:20px;color:var(--ivory);
  background:rgba(255,246,232,.06);border:0;border-bottom:2px solid var(--line);
  border-radius:14px 14px 0 0;padding:15px 16px;outline:none;caret-color:var(--pink);
  transition:border-color .2s,background .2s;
}
.input:focus,.textarea:focus{border-bottom-color:var(--pink);background:rgba(255,246,232,.1)}
.textarea{min-height:150px;resize:none;line-height:1.4}
.textarea.short{min-height:112px}
::placeholder{color:rgba(205,184,211,.6)}
.stack{display:grid;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  font:inherit;font-size:17px;padding:11px 18px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--ivory);
  transition:background .18s,color .18s,border-color .18s,transform .18s;
}
.chip[aria-checked="true"]{
  background:var(--champagne);border-color:var(--champagne);color:var(--night);
  font-weight:700;transform:scale(1.04);
}

/* Photo */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:176px;padding:22px;text-align:center;cursor:pointer;
  border:2px dashed var(--line);border-radius:22px;background:rgba(255,246,232,.04);
  transition:background .2s,border-color .2s;
}
.drop:hover{background:rgba(255,246,232,.08);border-color:var(--champagne)}
.drop b{font-size:20px}
.drop small{color:var(--mist);font-size:15px}
.drop .ico{font-size:34px;line-height:1}
.preview{margin:0;position:relative;border-radius:22px;overflow:hidden;background:rgba(255,246,232,.06)}
.preview img{display:block;width:100%;max-height:300px;object-fit:cover}
.preview .acts{display:flex;gap:10px;padding:12px;justify-content:flex-end}
.mini{
  font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--ivory);
}
.busy{padding:34px 0;text-align:center;color:var(--mist)}
.story{margin-top:22px}

/* Récap */
.recap{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:10px}
.recap li{
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding:13px 16px;border-radius:16px;background:rgba(255,246,232,.06);
}
.recap .k{display:block;font-size:14px;color:var(--mist)}
.recap .v{display:block;font-size:18px;overflow-wrap:anywhere}
.recap .v.skip{color:var(--mist);font-style:italic}
.recap img{display:block;margin-top:8px;width:84px;height:84px;object-fit:cover;border-radius:12px}
.link{
  flex:none;font:inherit;font-size:15px;color:var(--champagne);background:none;border:0;
  padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}

/* Fin */
.done .emoji{font-size:64px;line-height:1;margin-bottom:.3em}

/* Erreurs */
.err{min-height:1.4em;margin:6px 0 0;font-size:16px;color:var(--error)}

/* Boutons */
.btn{
  font:inherit;font-weight:700;border:0;border-radius:999px;min-height:56px;
  padding:15px 26px;cursor:pointer;transition:transform .15s,opacity .2s,background .2s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-primary{background:var(--champagne);color:var(--night)}
.btn-ghost{background:transparent;color:var(--ivory);border:1.5px solid var(--line)}
.btn-cta{width:100%;font-size:20px;min-height:62px}
.nav{
  display:none;position:sticky;bottom:0;gap:12px;width:100%;max-width:560px;margin:0 auto;
  padding:16px 20px calc(14px + var(--safe-bottom));
  background:linear-gradient(to top,var(--night) 62%,rgba(31,10,38,0));
}
.nav.on{display:flex}
.nav .btn-primary{flex:1}

:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.input:focus-visible,.textarea:focus-visible{outline:none}
.sr:focus-visible ~ .photo-area .drop{outline:3px solid var(--pink);outline-offset:3px}

/* Anti-spam */
.hp{position:absolute;left:-9999px;width:0;height:0;opacity:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

@media (min-width:700px){
  .stage{padding-top:64px}
}
@media (prefers-reduced-motion:reduce){
  .screen,.screen.back{animation:none}
  .progress i,.chip,.btn{transition:none}
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="progress" id="progress" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>

<div class="app">
  <main class="stage" id="stage">
    <noscript><p>Ce petit jeu a besoin de JavaScript pour fonctionner.</p></noscript>
  </main>
  <nav class="nav" id="nav" aria-label="Navigation du questionnaire">
    <button type="button" class="btn btn-ghost" id="back">Précédent</button>
    <button type="button" class="btn btn-primary" id="next">Suivant</button>
  </nav>
</div>

<input class="hp" id="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';

/* ============================================================
   CONFIGURATION — à modifier une seule fois
   Colle ici l'URL de déploiement de ton Google Apps Script
   (elle se termine par /exec). Voir LISEZ-MOI.md.
   ============================================================ */
const CONFIG = {
  ENDPOINT: 'COLLE_ICI_L_URL_DU_SCRIPT'
};

const DRAFT_KEY = 'manon30-brouillon-v1';
const TOTAL = 10;                       // écrans comptés dans la barre de progression
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LIENS = [
  ['famille', 'Famille'], ['ami', 'Ami(e)'], ['conjoint', 'Conjoint(e)'],
  ['collegue', 'Collègue'], ['autre', 'Autre']
];
const ANCIENNETE = ['Moins de 2 ans', '2 à 5 ans', '5 à 10 ans', 'Plus de 10 ans', 'Depuis toujours'];

const $ = s => document.querySelector(s);
const stage = $('#stage'), nav = $('#nav'), backBtn = $('#back'), nextBtn = $('#next'), bar = $('#progress');

/* ---------- Petit helper DOM (aucun innerHTML : les réponses restent du texte) ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

/* ---------- État ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

const blank = () => ({
  id: uid(), prenom: '', lien: '', anciennete: '', mots: ['', '', ''],
  qualite: '', defaut: '', manie: '', anecdote: '', meconnu: '', phrase: '',
  photo: '', photoContexte: ''
});

function loadDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!saved) return blank();
    const a = Object.assign(blank(), saved);
    if (!Array.isArray(a.mots) || a.mots.length !== 3) a.mots = ['', '', ''];
    return a;
  } catch (_) { return blank(); }
}
let A = loadDraft();
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(A)); } catch (_) { /* quota : tant pis */ }
  }, 300);
}

function flushDraft() {
  clearTimeout(saveTimer);
  if (cur === DONE) return;               // déjà envoyé : plus de brouillon
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(A)); } catch (_) {}
}
addEventListener('pagehide', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });

let cur = 0, sending = false, photoBusy = false;

/* ---------- Briques d'interface ---------- */
const Q = t => h('h2', { class: 'q', id: 'q-title' }, t);
const wink = t => h('p', { class: 'wink' }, t);
const optTag = () => h('span', { class: 'tag' }, 'Facultatif');

function onChange(fn) {
  return e => { clearErr(); fn(e.target.value); save(); updateNav(); };
}
function inputEl({ id, value, placeholder, max = 160, label, autocomplete = 'off', cap = 'sentences', auto, onInput, onEnter }) {
  const el = h('input', {
    class: 'input', type: 'text', id, placeholder, maxlength: max, autocomplete,
    autocapitalize: cap, enterkeyhint: 'next',
    'aria-label': label || null, 'aria-labelledby': label ? null : 'q-title',
    'data-autofocus': auto ? '' : null,
    oninput: onChange(onInput),
    onkeydown: e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); (onEnter || next)(); } }
  });
  el.value = value || '';
  return el;
}
function areaEl({ id, value, placeholder, max = 800, short, auto, onInput }) {
  const el = h('textarea', {
    class: 'textarea' + (short ? ' short' : ''), id, placeholder, maxlength: max,
    autocapitalize: 'sentences', 'aria-labelledby': 'q-title',
    'data-autofocus': auto ? '' : null, oninput: onChange(onInput)
  });
  el.value = value || '';
  return el;
}
function chipGroup(options, get, set, labelId) {
  const group = h('div', { class: 'chips', role: 'radiogroup', 'aria-labelledby': labelId });
  const paint = () => group.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-checked', String(c.dataset.value === get())));
  for (const [value, label] of options) {
    group.append(h('button', {
      type: 'button', class: 'chip', role: 'radio', 'data-value': value,
      onclick: () => { clearErr(); set(value); save(); paint(); }
    }, label));
  }
  paint();
  return group;
}

/* ---------- Écrans ---------- */
const lienLabel = () => (LIENS.find(l => l[0] === A.lien) || [, ''])[1];
const filled = v => String(v || '').trim().length > 0;

const STEPS = [
  /* 0 — Accueil */
  { nav: false, progress: false, render() {
    return h('section', { class: 'screen welcome' },
      h('div', { class: 'big30', 'aria-hidden': 'true' }, '30'),
      h('h1', {}, 'Mission : les 30 ans de Manon 🎂'),
      h('p', {}, 'Pour préparer une petite surprise pour les 30 ans de Manon, on a besoin de toi 👀'),
      h('p', {}, 'Quelques questions, quelques souvenirs et peut-être un petit dossier photo…'),
      h('p', {}, 'Promis, ça prend moins de 5 minutes.'),
      h('p', { class: 'secret' }, 'Et surtout : 🤫 Manon ne doit rien savoir !'),
      h('button', {
        type: 'button', class: 'btn btn-primary btn-cta',
        onclick: e => {
          const r = e.currentTarget.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top, 70);
          go(1, 'next');
        }
      }, 'Je participe →'));
  }},

  /* 1 — Qui es-tu ? */
  { render() {
    return h('section', { class: 'screen' },
      Q('Qui es-tu ?'),
      wink('Pas de panique, on ne te demande pas ta pièce d’identité.'),
      h('label', { class: 'field' },
        h('span', { class: 'lbl' }, 'Ton prénom'),
        inputEl({ id: 'f-prenom', value: A.prenom, placeholder: 'Ton prénom', max: 60,
          label: 'Ton prénom', autocomplete: 'given-name', cap: 'words', auto: true,
          onInput: v => { A.prenom = v; } })),
      h('div', { class: 'field' },
        h('span', { class: 'lbl', id: 'lbl-lien' }, 'Ton lien avec Manon'),
        chipGroup(LIENS, () => A.lien, v => { A.lien = v; }, 'lbl-lien')),
      h('div', { class: 'field' },
        h('span', { class: 'lbl', id: 'lbl-anc' }, 'Depuis combien de temps connais-tu Manon ?'),
        chipGroup(ANCIENNETE.map(a => [a, a]), () => A.anciennete, v => { A.anciennete = v; }, 'lbl-anc')));
  },
  validate() {
    if (!filled(A.prenom)) return { msg: 'Dis-nous au moins ton prénom.', sel: '#f-prenom' };
    if (!A.lien) return { msg: 'Choisis ton lien avec Manon.' };
    if (!A.anciennete) return { msg: 'Dis-nous depuis quand tu la connais (à peu près, ça suffit).' };
  }},

  /* 2 — 3 mots */
  { render() {
    const ph = ['Premier mot', 'Deuxième mot', 'Troisième mot'];
    const inputs = ph.map((p, i) => inputEl({
      id: 'f-mot' + i, value: A.mots[i], placeholder: p, max: 40, label: p, auto: i === 0,
      onInput: v => { A.mots[i] = v; },
      onEnter: () => { const n = $('#f-mot' + (i + 1)); n ? n.focus() : next(); }
    }));
    return h('section', { class: 'screen' },
      Q('Si tu devais décrire Manon en 3 mots, lesquels ?'),
      wink('Les premiers qui te viennent, sans réfléchir.'),
      h('div', { class: 'stack' }, inputs));
  },
  validate() {
    const i = A.mots.findIndex(m => !filled(m));
    if (i !== -1) return { msg: 'Il nous faut les 3 mots, même les plus évidents.', sel: '#f-mot' + i };
  }},

  /* 3 — Qualité */
  { render() {
    return h('section', { class: 'screen' },
      Q('Quelle est sa plus belle qualité ?'),
      h('div', { class: 'field' },
        inputEl({ id: 'f-qualite', value: A.qualite, placeholder: 'Sa plus belle qualité…', max: 160,
          auto: true, onInput: v => { A.qualite = v; } })));
  },
  validate() { if (!filled(A.qualite)) return { msg: 'Une qualité, même courte, suffit.', sel: '#f-qualite' }; }},

  /* 4 — Défaut */
  { render() {
    return h('section', { class: 'screen' },
      Q('Et son petit défaut le plus mignon ou le plus drôle ? 😈'),
      wink('On reste gentil… mais on veut quand même un peu de matière 👀'),
      h('div', { class: 'field' },
        inputEl({ id: 'f-defaut', value: A.defaut, placeholder: 'Son petit défaut…', max: 200,
          auto: true, onInput: v => { A.defaut = v; } })));
  },
  validate() { if (!filled(A.defaut)) return { msg: 'Un petit défaut, même minuscule, nous suffit.', sel: '#f-defaut' }; }},

  /* 5 — Manie */
  { render() {
    return h('section', { class: 'screen' },
      Q('Quelle manie, habitude ou petit truc est vraiment TRÈS Manon ?'),
      h('div', { class: 'field' },
        areaEl({ id: 'f-manie', value: A.manie, placeholder: 'Raconte-nous…', auto: true,
          onInput: v => { A.manie = v; } })));
  },
  validate() { if (!filled(A.manie)) return { msg: 'Dis-nous au moins une manie.', sel: '#f-manie' }; }},

  /* 6 — Anecdote (facultatif) */
  { optional: true, isEmpty: () => !filled(A.anecdote), render() {
    return h('section', { class: 'screen' },
      Q('Raconte-nous une anecdote avec Manon qui te fait encore rire.'),
      optTag(),
      h('div', { class: 'field' },
        areaEl({ id: 'f-anecdote', value: A.anecdote, max: 1500, placeholder: 'Il était une fois…', auto: true,
          onInput: v => { A.anecdote = v; } })));
  }},

  /* 7 — Info méconnue (facultatif) */
  { optional: true, isEmpty: () => !filled(A.meconnu), render() {
    return h('section', { class: 'screen' },
      Q('Quelle chose sur Manon peu de gens connaissent ? 👀'),
      wink('Une anecdote, un talent caché, une ancienne passion, une habitude improbable…'),
      optTag(),
      h('div', { class: 'field' },
        areaEl({ id: 'f-meconnu', value: A.meconnu, max: 1500, placeholder: 'Ce que peu de gens savent…', auto: true,
          onInput: v => { A.meconnu = v; } })));
  }},

  /* 8 — La phrase */
  { render() {
    return h('section', { class: 'screen' },
      Q('Complète cette phrase :'),
      h('p', { class: 'sentence' }, '« On sait que Manon est dans les parages quand… »'),
      h('div', { class: 'field' },
        areaEl({ id: 'f-phrase', value: A.phrase, short: true, max: 300, placeholder: '…', auto: true,
          onInput: v => { A.phrase = v; } })));
  },
  validate() { if (!filled(A.phrase)) return { msg: 'Complète la phrase, même en quelques mots.', sel: '#f-phrase' }; }},

  /* 9 — Le dossier photo (facultatif) */
  { optional: true, isEmpty: () => !A.photo, render() {
    const file = h('input', { class: 'sr', type: 'file', id: 'f-file', accept: 'image/*', 'aria-label': 'Choisir une photo',
      onchange: async e => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        clearErr();
        photoBusy = true; paint();
        try { A.photo = await shrinkImage(f); save(); }
        catch (_) { showError({ msg: 'Cette photo n’a pas pu être lue. Essaie avec une autre.' }); }
        photoBusy = false; paint();
      }});
    const area = h('div', { class: 'photo-area' });
    const story = h('div', { class: 'story' },
      h('label', { class: 'field' },
        h('span', { class: 'lbl' }, 'C’est quoi l’histoire derrière cette photo ?'),
        areaEl({ id: 'f-photoctx', value: A.photoContexte, short: true, max: 600,
          placeholder: 'Où, quand, avec qui, pourquoi elle est comme ça…',
          onInput: v => { A.photoContexte = v; } })));
    function paint() {
      area.replaceChildren();
      if (photoBusy) {
        area.append(h('p', { class: 'busy' }, 'Préparation de la photo…'));
      } else if (A.photo) {
        area.append(h('figure', { class: 'preview' },
          h('img', { src: A.photo, alt: 'Ta photo, en aperçu' }),
          h('div', { class: 'acts' },
            h('label', { class: 'mini', for: 'f-file', style: 'cursor:pointer' }, 'Changer'),
            h('button', { type: 'button', class: 'mini', onclick: () => {
              A.photo = ''; A.photoContexte = ''; story.querySelector('textarea').value = ''; save(); paint();
            } }, 'Retirer'))));
      } else {
        area.append(h('label', { class: 'drop', for: 'f-file' },
          h('span', { class: 'ico', 'aria-hidden': 'true' }, '📸'),
          h('b', {}, 'Ajouter une photo'),
          h('small', {}, 'Depuis ta galerie ou ton appareil photo')));
      }
      story.hidden = !(A.photo && !photoBusy);
      updateNav();
    }
    const el = h('section', { class: 'screen' },
      Q('Il est temps de sortir les dossiers. 📸'),
      wink('Tu as une photo drôle, ancienne, improbable ou juste TRÈS Manon ? C’est le moment.'),
      optTag(), file, area, story);
    paint();
    return el;
  }},

  /* 10 — Validation avant envoi */
  { render() {
    const skip = '—';
    const rows = [
      ['Ton prénom', A.prenom, 1],
      ['Ton lien avec Manon', lienLabel(), 1],
      ['Tu la connais depuis', A.anciennete, 1],
      ['Manon en 3 mots', A.mots.map(m => m.trim()).join(', '), 2],
      ['Sa plus belle qualité', A.qualite, 3],
      ['Son petit défaut', A.defaut, 4],
      ['Sa manie très Manon', A.manie, 5],
      ['Ton anecdote', A.anecdote, 6],
      ['Ce que peu de gens savent', A.meconnu, 7],
      ['On sait que Manon est dans les parages quand…', A.phrase, 8]
    ];
    const list = h('ul', { class: 'recap' });
    for (const [k, v, step] of rows) {
      const has = filled(v);
      list.append(h('li', {},
        h('div', {}, h('span', { class: 'k' }, k), h('span', { class: 'v' + (has ? '' : ' skip') }, has ? v : skip)),
        h('button', { type: 'button', class: 'link', onclick: () => go(step, 'back') }, 'Modifier')));
    }
    list.append(h('li', {},
      h('div', {},
        h('span', { class: 'k' }, 'Ta photo'),
        A.photo
          ? [h('img', { src: A.photo, alt: 'Aperçu de ta photo' }),
             h('span', { class: 'v', style: 'margin-top:6px' }, filled(A.photoContexte) ? A.photoContexte : 'Sans légende')]
          : h('span', { class: 'v skip' }, skip)),
      h('button', { type: 'button', class: 'link', onclick: () => go(9, 'back') }, 'Modifier')));
    return h('section', { class: 'screen' },
      Q('Dernier coup d’œil avant l’envoi'),
      wink('Tout est modifiable. Tes réponses partent chez l’organisateur, pas chez Manon 🤫'),
      list);
  }},

  /* 11 — Fin */
  { nav: false, progress: false, render() {
    return h('section', { class: 'screen done' },
      h('div', { class: 'emoji', 'aria-hidden': 'true' }, '🫡'),
      h('h2', { class: 'q', id: 'q-title' }, 'Mission accomplie 🫡'),
      h('p', {}, 'Merci ! Tes réponses vont peut-être se retrouver dans le jeu des 30 ans de Manon…'),
      h('p', {}, 'On ne garantit pas qu’elle te pardonnera la photo.'),
      h('p', { class: 'sentence' }, '🤫 D’ici l’anniversaire : secret absolu.'));
  }}
];
const LAST_FORM = 10, DONE = 11;

/* ---------- Navigation ---------- */
function go(n, dir) {
  cur = n;
  render(dir);
  window.scrollTo(0, 0);
}
function render(dir) {
  const s = STEPS[cur];
  const screen = s.render();
  if (dir === 'back') screen.classList.add('back');
  screen.append(h('p', { class: 'err', id: 'err', role: 'alert' }));
  stage.replaceChildren(screen);
  const pct = s.progress === false ? 0 : (cur / TOTAL) * 100;
  bar.classList.toggle('on', s.progress !== false);
  bar.firstElementChild.style.width = pct + '%';
  bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  updateNav();
  const f = stage.querySelector('[data-autofocus]');
  if (f) f.focus({ preventScroll: true });
  if (cur === DONE) { [0, 350, 750].forEach((d, i) => setTimeout(() => burst(innerWidth * (.25 + .25 * i), innerHeight * .45, 110), d)); }
}
function nextLabel() {
  const s = STEPS[cur];
  if (cur === LAST_FORM) return sending ? 'Envoi en cours…' : 'Envoyer en secret 🤫';
  if (s.optional && s.isEmpty()) return 'Passer';
  return 'Suivant';
}
function updateNav() {
  const s = STEPS[cur];
  nav.classList.toggle('on', s.nav !== false);
  nextBtn.textContent = nextLabel();
  nextBtn.disabled = sending || photoBusy;
  backBtn.disabled = sending;
}
function showError({ msg, sel }) {
  const el = $('#err'); if (el) el.textContent = msg;
  const t = sel && $(sel); if (t) t.focus({ preventScroll: true });
}
function clearErr() { const el = $('#err'); if (el) el.textContent = ''; }

function next() {
  if (sending || photoBusy) return;
  const s = STEPS[cur];
  if (s.validate) { const e = s.validate(); if (e) { showError(e); return; } }
  if (cur === LAST_FORM) { submit(); return; }
  go(cur + 1, 'next');
}
nextBtn.addEventListener('click', next);
backBtn.addEventListener('click', () => { if (!sending && cur > 0) go(cur - 1, 'back'); });

/* ---------- Photo : redimensionnement côté téléphone ---------- */
async function shrinkImage(file) {
  if (file.size > 40 * 1024 * 1024) throw new Error('trop lourd');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => {
      const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url;
    });
    const max = 1600, r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * r));
    c.height = Math.max(1, Math.round(img.naturalHeight * r));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Envoi réel vers le Google Sheet (via Apps Script) ---------- */
async function submit() {
  if (!CONFIG.ENDPOINT || CONFIG.ENDPOINT.startsWith('COLLE_')) {
    showError({ msg: 'L’envoi n’est pas encore configuré : colle l’URL du script dans index.html (voir LISEZ-MOI.md).' });
    return;
  }
  sending = true; updateNav(); clearErr();
  const payload = {
    id: A.id,
    prenom: A.prenom.trim(),
    lien: lienLabel(),
    anciennete: A.anciennete,
    mots: A.mots.map(m => m.trim()),
    qualite: A.qualite.trim(),
    defaut: A.defaut.trim(),
    manie: A.manie.trim(),
    anecdote: A.anecdote.trim(),
    meconnu: A.meconnu.trim(),
    phrase: A.phrase.trim(),
    photo: A.photo || '',
    photoContexte: A.photo ? A.photoContexte.trim() : '',
    website: $('#hp').value
  };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    // Corps en text/plain : requête « simple », donc sans pré-vérification CORS.
    const res = await fetch(CONFIG.ENDPOINT, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
    const data = await res.json();
    if (!data || !data.ok) throw new Error((data && data.error) || 'Réponse inattendue');
    try { localStorage.removeItem(DRAFT_KEY); } catch (_) {}
    A = blank();
    sending = false;
    go(DONE, 'next');
  } catch (err) {
    console.error(err);
    sending = false; updateNav();
    showError({ msg: 'L’envoi n’a pas abouti. Vérifie ta connexion puis appuie à nouveau sur le bouton : tes réponses sont conservées.' });
  } finally { clearTimeout(timer); }
}

/* ---------- Confettis ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0, W = 0, H = 0;
function fit() {
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit); fit();
const COLORS = ['#F4DDA4', '#FF5C93', '#FFF6E8', '#B58CFF'];
function burst(x, y, n = 90) {
  if (REDUCED) return;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.9, v = 6 + Math.random() * 9;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: COLORS[i % COLORS.length], t: 0 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.y < H + 30 && p.t < 240);
  for (const p of parts) {
    p.t++; p.vy += .33; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, 1 - p.t / 240);
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, W, H);
}

/* ---------- Démarrage ---------- */
render();
})();
</script>
