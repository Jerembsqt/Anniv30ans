<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Manon, 30 ans : le grand déballage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#1F0A26; --velvet:#4B1E5E; --champagne:#F4DDA4; --pink:#FF5C93; --lilac:#B79BFF;
  --ivory:#FFF6E8; --mist:#CDB8D3; --line:rgba(244,221,164,.26); --card:rgba(255,246,232,.06);
  --display:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --wink:'Instrument Serif', Georgia, 'Times New Roman', serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;color:var(--ivory);font-family:var(--display);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 45% at 50% -8%, var(--velvet) 0%, transparent 62%), radial-gradient(70% 40% at 100% 100%, rgba(255,92,147,.15) 0%, transparent 60%), var(--night);
  background-attachment:fixed;background-color:var(--night);
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* ---------- Vues ---------- */
#console,#fiche,#pub{display:none}
body[data-view="console"] #console{display:block}
body[data-view="fiche"] #fiche{display:block}
body[data-view="stage"] #pub{display:block}
body[data-view="stage"]{overflow:hidden}

/* ---------- Boutons ---------- */
.btn{border:0;border-radius:999px;min-height:44px;padding:9px 20px;cursor:pointer;font-weight:700;background:var(--champagne);color:var(--night);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ivory);border:1.5px solid var(--line)}
.btn.big{min-height:60px;font-size:20px;padding:12px 28px}
.btn.pink{background:var(--pink);color:var(--night)}
.btn.sm{min-height:36px;padding:4px 14px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:default}

/* ---------- Console ---------- */
.app{max-width:1440px;margin:0 auto;padding:18px 20px 48px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;font-stretch:85%;letter-spacing:-.01em}
.top h1 span{color:var(--champagne)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--mist);font-size:15px}
.status i{width:12px;height:12px;border-radius:50%;background:#7a6a80}
.status.ok{color:var(--ivory)}
.status.ok i{background:#7CE3A1}
details.help{margin-top:12px;border-radius:16px;background:var(--card);padding:10px 16px;color:var(--mist)}
details.help summary{cursor:pointer;color:var(--ivory);font-weight:700}
details.help ol{margin:10px 0 4px;padding-left:22px}
details.help li{margin:4px 0}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 350px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:1150px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:22px;padding:16px}
.panel h2{margin:0 0 10px;font-size:18px;font-weight:700;font-stretch:90%}
.slist{max-height:74vh;overflow:auto;display:grid;gap:4px;padding-right:4px}
.mh{margin:12px 0 4px;font-family:var(--wink);font-style:italic;font-size:20px;color:var(--champagne)}
.mh:first-child{margin-top:0}
.li{display:flex;gap:8px;align-items:center;text-align:left;width:100%;border:1.5px solid transparent;background:transparent;border-radius:12px;padding:7px 10px;cursor:pointer;color:var(--ivory);font-size:15px}
.li:hover{background:rgba(255,246,232,.07)}
.li.cur{background:var(--champagne);color:var(--night);font-weight:700}
.li .w{margin-left:auto}
.pv{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1.5px solid var(--line)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.ctrls .grow{flex:1;min-width:200px}
.pos{color:var(--mist);margin-top:10px;font-size:15px}
.acard{display:grid;gap:12px}
.acard .k{display:block;font-size:13px;color:var(--mist)}
.acard .v{margin:0;font-size:17px;overflow-wrap:anywhere}
.acard .ans{font-size:26px;font-weight:800;font-stretch:88%;color:var(--champagne);line-height:1.15}
.acard .warn{padding:10px 12px;border-radius:12px;background:rgba(255,92,147,.16);border:1.5px solid rgba(255,92,147,.5)}
.score{display:grid;gap:8px;margin-top:6px}
.trow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center}
.trow i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.trow input{min-width:0;font:inherit;color:var(--ivory);background:rgba(255,246,232,.08);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.pts{display:flex;align-items:center;gap:6px}
.pts b{min-width:2ch;text-align:center;font-size:22px;color:var(--champagne)}
.pts button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.pts button.plus{background:var(--champagne);color:var(--night);border-color:var(--champagne);font-weight:800}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--champagne);color:var(--night);font-weight:700}
.keys{margin:10px 0 0;color:var(--mist);font-size:14px}

/* ---------- Fiche animateur ---------- */
.fiche-wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.fiche-wrap h1{margin:0 0 6px;font-size:30px;font-weight:800;font-stretch:85%}
.fiche-wrap table{width:100%;border-collapse:collapse;margin:14px 0 24px;font-size:15px}
.fiche-wrap th,.fiche-wrap td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.fiche-wrap th{color:var(--champagne);font-weight:700}
.fiche-wrap h2{margin:24px 0 4px;font-size:22px;font-family:var(--wink);font-style:italic;color:var(--champagne);font-weight:400}
.fiche-wrap ul{margin:6px 0;padding-left:22px}
.fiche-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
@media print{
  body{background:#fff;color:#000}
  #console,#pub{display:none !important}
  #fiche{display:block !important}
  .fiche-actions{display:none}
  .fiche-wrap th{color:#000}.fiche-wrap td,.fiche-wrap th{border-color:#999}
  .fiche-wrap h2{color:#000}
}

/* ---------- Écran public ---------- */
#pub{position:fixed;inset:0;background:#000;z-index:20}
.stagehost{position:absolute;inset:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  color:var(--ivory);font-family:var(--display);font-size:40px;line-height:1.15;user-select:none;
  background:radial-gradient(90% 70% at 50% -10%, var(--velvet) 0%, transparent 62%), radial-gradient(55% 45% at 100% 105%, rgba(255,92,147,.24) 0%, transparent 62%), var(--night)}
.stage::after{content:"";position:absolute;inset:26px;border:2px solid rgba(244,221,164,.22);border-radius:40px;pointer-events:none}
.stage .layer{position:absolute;inset:0}
.stage canvas{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:5}
.sc{position:absolute;inset:0;padding:84px 120px 175px;display:flex;flex-direction:column;justify-content:center}
.sc.enter{animation:fadein .4s ease both}
@keyframes fadein{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;scale:.88}to{opacity:1;scale:1}}
.kick{font-family:var(--wink);font-style:italic;font-size:54px;color:var(--champagne);line-height:1.05}
.q{margin:.18em 0 0;font-size:112px;font-weight:800;font-stretch:80%;line-height:1;letter-spacing:-.02em;text-wrap:balance}
.q.mid{font-size:88px}
.q.sm{font-size:74px}
.sub2{font-family:var(--wink);font-style:italic;font-size:50px;color:var(--mist);margin-top:14px}
.opts{display:grid;gap:22px;margin-top:40px}
.opt{display:flex;align-items:center;gap:28px;padding:22px 36px;border-radius:28px;border:3px solid var(--line);font-size:62px;font-weight:700;font-stretch:90%;background:rgba(255,246,232,.05);transition:opacity .3s}
.opt b{width:86px;height:86px;border-radius:50%;background:var(--champagne);color:var(--night);display:grid;place-items:center;font-size:52px;flex:none}
.opt.win{background:var(--champagne);color:var(--night);border-color:var(--champagne)}
.opt.win b{background:var(--night);color:var(--champagne)}
.opt.lose{opacity:.25}
.done .q{font-size:62px}
.done .q.mid{font-size:62px}
.done .opts{margin-top:24px;gap:14px}
.done .opt{font-size:44px;padding:12px 28px}
.done .opt b{width:58px;height:58px;font-size:36px}
.five .opt{font-size:46px;padding:10px 28px;gap:22px}
.five .opt b{width:56px;height:56px;font-size:34px}
.opts.five{gap:12px;margin-top:24px}
.done .five .opt{font-size:34px;padding:6px 22px}
.done .five .opt b{width:42px;height:42px;font-size:26px}
.done .opts.five{gap:8px}
.split .opt{font-size:46px;padding:16px 28px}
.split .opt b{width:64px;height:64px;font-size:40px}
.split.done .opt{font-size:36px;padding:10px 22px}
.split.done .opt b{width:46px;height:46px;font-size:30px}
.rev{margin-top:34px}
.ans{font-size:104px;font-weight:800;font-stretch:80%;line-height:1;letter-spacing:-.02em;color:var(--champagne);text-shadow:5px 5px 0 var(--pink);text-wrap:balance}
.split .ans{font-size:78px}
.rev .sub{font-family:var(--wink);font-style:italic;font-size:54px;color:var(--ivory);margin-top:16px}
.rev .by{font-size:34px;color:var(--mist);margin-top:14px}
.split{flex-direction:row;align-items:center;gap:90px}
.split .side{flex:1;min-width:0}
.pol{position:relative;margin:0;background:var(--ivory);padding:22px 22px 26px;border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.55);color:var(--night)}
.pol img{display:block;width:100%;object-fit:cover;border-radius:4px}
.pol.big{width:600px;flex:none;rotate:-2.5deg}
.pol.big img{height:760px;object-position:50% 20%}
.tape{position:absolute;top:-26px;left:50%;translate:-50% 0;width:200px;height:54px;background:rgba(244,221,164,.78);rotate:-3deg;border-radius:4px}
.stamp{position:absolute;right:-40px;bottom:70px;rotate:-12deg;border:9px solid var(--pink);color:var(--pink);font-size:86px;font-weight:800;font-stretch:80%;padding:4px 30px;border-radius:14px;background:rgba(31,10,38,.8)}
.trio{display:grid;grid-template-columns:repeat(3,470px);gap:64px;justify-content:center;margin-top:26px}
.trio .pol{padding:18px 18px 20px}
.trio .pol img{height:380px}
.trio .t0{rotate:-2deg}.trio .t1{rotate:1.5deg}.trio .t2{rotate:-1deg}
.pol figcaption{margin-top:12px;font-size:28px;line-height:1.15}
.pol figcaption b{display:block;font-family:var(--wink);font-style:italic;font-weight:400;font-size:34px}
.pol.ghost{height:520px;background:transparent;border:4px dashed var(--line);box-shadow:none;display:grid;place-items:center;font-size:120px;color:var(--line);rotate:0deg}
.verdict{margin-top:30px;text-align:center;font-family:var(--wink);font-style:italic;font-size:54px;color:var(--champagne)}
.verdict.dim{color:var(--mist)}
.clues{display:grid;gap:18px;margin-top:34px}
.clue{padding:18px 36px;border-radius:26px;background:rgba(255,246,232,.07);border:3px solid var(--line);font-size:52px;font-weight:700;font-stretch:90%}
.clue span{display:block;font-family:var(--wink);font-style:italic;font-weight:400;font-size:38px;color:var(--champagne)}
.done .clue{font-size:40px;padding:12px 28px}
.done .clue span{font-size:28px}
.plist{display:grid;gap:18px;margin-top:30px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:20px 36px;border-radius:26px;background:rgba(255,246,232,.07);border:3px solid var(--line)}
.pl .qt{font-size:62px;font-weight:700;font-stretch:88%}
.pl .who{flex:none;padding:6px 26px;border-radius:999px;background:var(--champagne);color:var(--night);font-weight:800;font-size:46px}
.pl .who.ghostw{background:transparent;border:3px dashed var(--line);color:var(--line)}
.chips5{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.chip5{display:inline-flex;flex-direction:column;padding:8px 24px;border-radius:22px;border:3px solid var(--line);font-size:38px;font-weight:700;transition:opacity .3s}
.chip5 small{font-family:var(--wink);font-style:italic;font-weight:400;font-size:28px;color:var(--mist)}
.chip5.used{opacity:.3}
.chips5.tight{gap:10px;margin-top:20px}
.chips5.tight .chip5{font-size:30px;padding:6px 18px}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:50px}
.stk{min-height:380px;border-radius:36px;border:4px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.stk .w{font-size:130px;font-weight:800;font-stretch:78%;color:var(--line);line-height:1}
.stk.on{border:0;background:var(--champagne);color:var(--night);rotate:-1.5deg}
.stk.on:nth-child(2){rotate:1.5deg}
.stk.on .w{color:var(--night);font-size:112px}
.stk .by{font-size:34px;margin-top:20px;font-weight:600}
.rank{display:grid;gap:10px;margin-top:22px}
.rk{display:flex;align-items:center;gap:30px;padding:8px 30px;border-radius:24px;background:rgba(255,246,232,.05);border:3px dashed var(--line);font-size:50px;font-weight:800;font-stretch:85%}
.rk .n{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:32px;color:var(--mist);flex:none}
.rk.on{background:var(--champagne);color:var(--night);border:3px solid var(--champagne)}
.rk.on .n{background:var(--night);color:var(--champagne);border-color:var(--night)}
.rk .d{margin-left:auto;font-family:var(--wink);font-style:italic;font-weight:400;font-size:38px}
.rows{display:grid;gap:16px;margin-top:30px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:30px;padding:14px 36px;border-radius:26px;background:rgba(255,246,232,.07);border:3px solid var(--line)}
.row .t{font-size:68px;font-weight:800;font-stretch:84%;color:var(--champagne);line-height:1.05}
.row .by{font-family:var(--wink);font-style:italic;font-size:42px;color:var(--mist);text-align:right}
.rows.two{grid-template-columns:1fr 1fr;gap:16px}
.rows.two .row{flex-direction:column;align-items:flex-start;gap:2px}
.rows.two .t{font-size:52px}
.rows.two .by{font-size:32px;text-align:left}
.rows.sm .t{font-size:56px;font-weight:700;font-stretch:90%;color:var(--ivory)}
.cloud{display:flex;flex-wrap:wrap;gap:18px 20px;justify-content:center;align-items:center;margin-top:40px}
.cloud span{padding:6px 26px;border-radius:999px;border:3px solid var(--line);font-size:50px;font-weight:700;transition:all .5s}
.cloud span.hot{background:var(--champagne);border-color:var(--champagne);color:var(--night);font-size:84px;font-weight:800;font-stretch:84%}
.cloud.dimmed span:not(.hot){opacity:.35}
.duo{display:flex;justify-content:center;align-items:center;gap:90px;margin-top:20px}
.duo .pol{width:520px}
.duo .pol img{height:560px}
.duo .pol figcaption{font-size:34px}
.duo .a{rotate:-3deg}.duo .b{rotate:2.5deg}
.mcol{align-items:center;text-align:center}
.mnum{font-size:240px;font-weight:800;font-stretch:78%;color:var(--champagne);text-shadow:10px 10px 0 var(--pink);line-height:.9;letter-spacing:-.02em}
.mtitle{font-size:108px;font-weight:700;font-stretch:88%;margin-top:34px;line-height:1.02;text-wrap:balance}
.msub{font-family:var(--wink);font-style:italic;font-size:56px;color:var(--mist);margin-top:26px}
.home .big30{font-size:600px;font-weight:800;font-stretch:75%;line-height:.78;color:var(--champagne);text-shadow:16px 16px 0 var(--pink);letter-spacing:-.04em;margin:40px 0 30px}
.home .nm{font-size:104px;font-weight:800;font-stretch:80%;letter-spacing:-.02em}
.fin .l1{font-size:210px;font-weight:800;font-stretch:78%;color:var(--champagne);text-shadow:10px 10px 0 var(--pink);line-height:.95;letter-spacing:-.02em}
.fin .l2{font-size:90px;font-weight:700;font-stretch:88%;max-width:1560px;text-wrap:balance;margin-top:40px;line-height:1.08}
.fin .l3{font-family:var(--wink);font-style:italic;font-size:50px;color:var(--mist);margin-top:44px}
.board{position:absolute;left:120px;right:120px;bottom:58px;display:flex;gap:18px;align-items:center;justify-content:center;font-weight:700;font-size:36px}
.board[hidden]{display:none}
.bchip{display:flex;align-items:center;gap:14px;padding:8px 26px;border-radius:999px;background:rgba(255,246,232,.08);border:2px solid var(--line)}
.bchip i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.bchip b{color:var(--champagne);font-size:46px;min-width:1.1em;text-align:right}
.sbar{position:absolute;top:10px;right:10px;z-index:30;display:flex;gap:8px;opacity:0;transition:opacity .2s}
#pub:hover .sbar,.sbar:focus-within{opacity:1}
.peek{position:absolute;left:14px;bottom:14px;z-index:30;max-width:min(520px,60vw);padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.82);border:1.5px solid var(--pink);font-size:16px}
.peek[hidden]{display:none}
.peek .ans{font-size:22px;text-shadow:none}

.cmp .opt{font-size:50px;padding:14px 30px}
.cmp .opt b{width:64px;height:64px;font-size:40px}
.cmp.done .opt{font-size:34px;padding:8px 22px}
.cmp.done .opt b{width:44px;height:44px;font-size:28px}
.cmp .ans{font-size:84px}
.cmp.done .opts{margin-top:18px;gap:10px}
.blank{color:var(--line)}
.hintline{margin-top:-4px;padding-left:36px;font-family:var(--wink);font-style:italic;font-size:48px;color:var(--champagne)}
.fill{color:var(--champagne);text-shadow:4px 4px 0 var(--pink);font-weight:800}
.teamsl{flex-direction:row;align-items:center;gap:90px}
.teamsl .tl{flex:1;min-width:0}
.tlist{margin:34px 0 0;padding:0;list-style:none;display:grid;gap:18px;font-size:50px;font-weight:700;font-stretch:90%}
.tlist li{padding:18px 32px;border-radius:24px;background:rgba(255,246,232,.07);border:3px solid var(--line)}
.qrbig{flex:none;width:560px;text-align:center}
.qrbig svg{display:block;width:100%;border-radius:28px}
.qrcap{margin-top:20px;font-family:var(--wink);font-style:italic;font-size:54px;color:var(--champagne)}
.qrb{position:absolute;right:70px;bottom:36px;width:150px;z-index:4;text-align:center}
.qrb[hidden]{display:none}
.qrb svg{display:block;width:100%;border-radius:12px}
.qrb span{display:block;font-size:22px;margin-top:2px;color:var(--mist)}
.bigqr{position:absolute;inset:0;z-index:6;background:rgba(31,10,38,.94);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigqr[hidden]{display:none}
.bigqr svg{width:640px;border-radius:32px}
.bigqr .qrcap{font-size:70px}
.board.mid{font-size:30px;gap:12px}
.board.mid .bchip b{font-size:38px}
.board.dense{font-size:24px;gap:8px}
.board.dense .bchip{padding:6px 14px;gap:8px}
.board.dense .bchip b{font-size:32px}
.board.dense .bchip i{width:14px;height:14px}
.board.withqr{right:260px}
.tagc{font-size:56px;color:var(--pink);border:8px solid var(--pink);padding:4px 36px;border-radius:14px;rotate:-4deg;font-weight:800;font-stretch:80%}
.big2{font-size:150px;font-weight:800;font-stretch:78%;color:var(--champagne);text-shadow:8px 8px 0 var(--pink);line-height:.95;text-wrap:balance;margin-top:34px}
.cloud.all span{opacity:0;animation:pop .6s cubic-bezier(.2,1.3,.4,1) forwards}
.cloud.all span.q{background:var(--champagne);border-color:var(--champagne);color:var(--night);font-weight:800}
.rows.two.all .row{opacity:0;animation:pop .6s cubic-bezier(.2,1.3,.4,1) forwards}
.vote{display:flex;gap:80px;justify-content:center;margin-top:50px}
.vote div{padding:34px 60px;border-radius:40px;font-size:84px;font-weight:800;font-stretch:80%}
.vote div:first-child{background:var(--champagne);color:var(--night)}
.vote div:last-child{background:var(--pink);color:var(--night)}
/* console v2 */
.gotrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.gotrow[hidden]{display:none}
.gotrow .k{font-size:14px;color:var(--mist)}
.gb{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.gb i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.gb.on{background:var(--champagne);color:var(--night);border-color:var(--champagne);font-weight:700}
.nm.wide{width:100%;font:inherit;color:var(--ivory);background:rgba(255,246,232,.08);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.hint{font-size:14px !important;color:var(--mist)}
.ctrls.tight{margin-top:4px}
.ctrls .btn.on{background:var(--champagne);color:var(--night)}
@media (prefers-reduced-motion:reduce){.cloud.all span,.rows.two.all .row{animation:none;opacity:1}}

.layout.two{grid-template-columns:270px minmax(0,1fr)}
@media (max-width:1150px){.layout.two{grid-template-columns:1fr}}
.acard.under{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.sc.enter,.pop{animation:none}.btn,.opt,.cloud span{transition:none}}
</style>
</head>
<body data-view="console">

<main id="console"><div class="app" id="app"></div></main>
<section id="fiche"><div class="fiche-wrap" id="fichebody"></div></section>
<section id="pub" aria-label="Écran public">
  <div class="stagehost" id="pubhost"></div>
  <div class="sbar">
    <button class="btn ghost sm" data-act="console" type="button">Console (Échap)</button>
    <button class="btn ghost sm" data-act="full" type="button">Plein écran (F)</button>
  </div>
  <div class="peek" id="peek" hidden></div>
</section>

/* =====================================================================
   État partagé et synchronisation
   ===================================================================== */
const NS = 'manon30.state.v3';
function clean(r) {
  if (!r || typeof r !== 'object') return null;
  const i = Number.isInteger(r.i) && r.i >= 0 && r.i < SL.length ? r.i : 0;
  const step = Number.isInteger(r.step) && r.step >= 0 && r.step < SL[i].n ? r.step : 0;
  return { v: Number(r.v) || 0, i, step };
}
let S = { v: 0, i: 0, step: 0 };
try { const saved = clean(JSON.parse(localStorage.getItem(NS) || 'null')); if (saved) S = saved; } catch (e) {}
let view = 'console', room = null, bc = null, lastPublicSeen = 0;
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function persist() { try { localStorage.setItem(NS, JSON.stringify(S)); } catch (e) {} }
function broadcast() {
  try { if (bc) bc.postMessage({ t: 'state', s: S }); } catch (e) {}
  try { if (room) room.emit('state', S).catch(() => {}); } catch (e) {}
}
function commit(patch) {
  Object.assign(S, patch);
  S.v = Math.max(Date.now(), S.v + 1);
  persist(); broadcast(); refresh();
}
function applyRemote(raw) {
  const r = clean(raw);
  if (r && r.v > S.v) { S = r; persist(); refresh(); }
}
function initSync() {
  try {
    if ('BroadcastChannel' in window) {
      bc = new BroadcastChannel('manon30-v3');
      bc.onmessage = ev => {
        const d = ev.data || {};
        if (d.t === 'state') applyRemote(d.s);
        else if (d.t === 'hello') { if (S.v > 0) broadcast(); }
        else if (d.t === 'alive' && d.role === 'stage') lastPublicSeen = Date.now();
      };
      bc.postMessage({ t: 'hello' });
      setInterval(() => { try { bc.postMessage({ t: 'alive', role: view }); } catch (e) {} }, 2000);
    }
  } catch (e) { bc = null; }
  (async () => {
    try {
      if (!(window.claude && window.claude.use)) return;
      const r = await window.claude.use('room');
      if (!r) return;
      room = r;
      r.on('state', m => { if (!m.sameTab) applyRemote(m.data); });
      r.on('hello', m => { if (!m.sameTab && S.v > 0) broadcast(); });
      r.onPeers(ch => { if (ch.joined.some(p => !p.sameTab) && S.v > 0) broadcast(); updateStatus(); });
      r.presence({ role: view }).catch(() => {});
      r.emit('hello', {}).catch(() => {});
      setInterval(() => { if (S.v > 0) broadcast(); }, 5000);
      updateStatus();
    } catch (e) { room = null; }
  })();
  setInterval(updateStatus, 2000);
}
function publicConnected() {
  if (view === 'stage') return true;
  if (Date.now() - lastPublicSeen < 6000) return true;
  try { if (room) return room.peers().some(p => !p.sameTab && p.presence && p.presence.role === 'stage'); } catch (e) {}
  return false;
}

/* =====================================================================
   Navigation
   ===================================================================== */
function advance() {
  const s = SL[S.i];
  if (S.step < s.n - 1) commit({ step: S.step + 1 });
  else if (S.i < SL.length - 1) commit({ i: S.i + 1, step: 0 });
}
function back() {
  if (S.step > 0) commit({ step: S.step - 1 });
  else if (S.i > 0) commit({ i: S.i - 1, step: SL[S.i - 1].n - 1 });
}
function skip() { if (S.i < SL.length - 1) commit({ i: S.i + 1, step: 0 }); }
function revealAll() { commit({ step: SL[S.i].n - 1 }); }
function goTo(k) { if (k >= 0 && k < SL.length) commit({ i: k, step: 0 }); }
function nextLabel() {
  const s = SL[S.i];
  if (S.i === 0) return 'Lancer le jeu';
  if (S.step >= s.n - 1) return S.i === SL.length - 1 ? 'Fin du jeu' : 'Diapo suivante';
  if (s.lab) return s.lab(S.step);
  return S.step === s.n - 2 ? 'Révéler la réponse' : 'Afficher la suite';
}

   ===================================================================== */
function makeStage(host) {
  host.innerHTML = '<div class="stage"><div class="layer"></div><canvas width="1920" height="1080"></canvas></div>';
  return host.firstElementChild;
}
function burst(cv) {
  if (!cv || reduced) return;
  const c = cv.getContext('2d'), tok = (cv._t = (cv._t || 0) + 1), cols = ['#FF5C93', '#F4DDA4', '#B79BFF', '#FFF6E8'];
  const P = Array.from({ length: 170 }, () => ({ x: 960 + (Math.random() - .5) * 360, y: 1160, vx: (Math.random() - .5) * 34, vy: -(20 + Math.random() * 26), w: 10 + Math.random() * 14, h: 6 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * 4) | 0] }));
  let t = 0;
  (function f() {
    if (cv._t !== tok) return;
    c.clearRect(0, 0, 1920, 1080); t++; let alive = false;
    for (const p of P) { p.vy += .75; p.x += p.vx; p.y += p.vy; p.r += p.vr; if (p.y < 1250) alive = true;
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
    if (alive && t < 230) requestAnimationFrame(f); else c.clearRect(0, 0, 1920, 1080);
  })();
}
function paintStage(st, isPub) {

    const newSlide = st._i !== S.i;
    st.querySelector('.layer').innerHTML = s.render(S.step);
    const sc = st.querySelector('.sc');
    if (sc && newSlide && !reduced) sc.classList.add('enter');
    st._key = key; st._i = S.i;
    if (isPub && s.fx && s.fx.includes(S.step)) burst(st.querySelector('canvas'));
  }
}
function fit(host, st) {
  if (!host || !st) return;
  const k = Math.min(host.clientWidth / 1920, host.clientHeight / 1080) || 0.1;
  st.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}

/* =====================================================================
   Console animateur
   ===================================================================== */
let pvStage = null, pubStage = null;
const $ = (s, el = document) => el.querySelector(s);

function buildConsole() {
  const app = $('#app');
  app.innerHTML = `
  <div class="top">
    <h1>Manon, 30 ans <span>· console animateur</span></h1>
    <div class="tools">
      <span class="status" id="status"><i></i><span>Écran public : non connecté</span></span>
      <button class="btn" data-act="stage" type="button">Passer en écran public</button>
      <button class="btn ghost" data-act="fiche" type="button">Fiche animateur</button>
    </div>
  </div>
  <details class="help"><summary>Comment projeter le jeu ?</summary>
    <ol>
      <li>Ouvre ce même lien dans une deuxième fenêtre (ou un deuxième onglet).</li>
      <li>Dans cette deuxième fenêtre, clique sur « Passer en écran public », puis glisse-la sur le projecteur et passe en plein écran (touche F, ou F11 dans le navigateur).</li>
      <li>Pilote tout depuis la première fenêtre : l’indicateur ci-dessus passe à « connecté » quand les deux fenêtres se parlent.</li>
      <li>Un seul écran ? Clique sur « Passer en écran public » dans cette fenêtre : tu pilotes au clavier et la touche A affiche les réponses en incrustation (visible si l’écran est dupliqué). Sinon, imprime la fiche animateur.</li>
    </ol>
  </details>
  <div class="layout two">
    <nav class="panel" aria-label="Diapositives"><h2>Déroulé</h2><div class="slist" id="slist"></div></nav>
    <section class="panel">
      <div class="pv" id="pv"></div>
      <div class="pos" id="pos"></div>
      <div class="ctrls">
        <button class="btn ghost" data-act="prev" type="button">← Précédent</button>
        <button class="btn big grow" data-act="next" id="nextbtn" type="button">Lancer le jeu</button>
        <button class="btn ghost" data-act="all" type="button">Tout révéler</button>
        <button class="btn ghost" data-act="skip" type="button">Passer</button>
      </div>
      <p class="keys">Raccourcis : → ou Espace suivant · ← retour · S passer · R tout révéler · F plein écran · Échap quitter l’écran public.</p>
      <div class="acard under">
        <h2>Pour toi (jamais à l’écran)</h2>
        <div><span class="k">Réponse</span><p class="v ans" id="a-ans"></p></div>
        <div><span class="k">Source</span><p class="v" id="a-by"></p></div>
        <div><span class="k">Consigne</span><p class="v" id="a-tip"></p></div>
        <div id="a-warn" class="warn" hidden></div>
        <div><span class="k">Prochain clic</span><p class="v" id="a-next"></p></div>
      </div>
    </section>
  </div>`;

  let html = '', lastM = -1;
  SL.forEach((s, k) => {
    if (s.m !== lastM) { html += `<div class="mh">${esc(MANCHES[s.m])}</div>`; lastM = s.m; }
    html += `<button class="li" data-act="go" data-i="${k}" type="button">${esc(s.label)}${s.warn ? '<span class="w" title="À valider">⚠</span>' : ''}</button>`;
  });
  $('#slist').innerHTML = html;

  pvStage = makeStage($('#pv'));
  if (window.ResizeObserver) new ResizeObserver(() => fit($('#pv'), pvStage)).observe($('#pv'));
  fit($('#pv'), pvStage);
}

function updateStatus() {
  const el = $('#status'); if (!el) return;
  const ok = publicConnected() && view !== 'stage';
  el.classList.toggle('ok', ok);
  el.lastElementChild.textContent = ok ? 'Écran public : connecté' : 'Écran public : non connecté';
}

function refresh() {
  const s = SL[S.i];
  if (view === 'console') {
    document.querySelectorAll('.li').forEach(b => b.classList.toggle('cur', +b.dataset.i === S.i));
    const cur = $('.li.cur'); if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    $('#pos').textContent = 'Diapo ' + (S.i + 1) + ' sur ' + SL.length + ' · étape ' + (S.step + 1) + ' sur ' + s.n;
    $('#nextbtn').textContent = nextLabel();
    $('#nextbtn').disabled = S.i === SL.length - 1 && S.step >= s.n - 1;
    $('#a-ans').textContent = s.ans || '';
    $('#a-by').textContent = s.by || '—';
    $('#a-tip').textContent = s.tip || '—';
    const w = $('#a-warn'); w.hidden = !s.warn; w.textContent = s.warn ? '⚠ ' + s.warn : '';
    $('#a-next').textContent = nextLabel();
    paintStage(pvStage, false);
  }
  if (view === 'stage') {
    paintStage(pubStage, true);
    const pk = $('#peek');
    if (!pk.hidden) pk.innerHTML = `<div class="ans">${esc(s.ans || '')}</div><div>${esc(s.by || '')}</div><div style="margin-top:6px;color:#CDB8D3">${esc(s.tip || '')}</div><div style="margin-top:6px">→ ${esc(nextLabel())}</div>`;
  }
}

/* =====================================================================
   Fiche animateur (secours imprimable)
   ===================================================================== */
function buildFiche() {
  let rows = '', lastM = -1;
  SL.forEach((s, k) => {
    if (s.m !== lastM) { rows += `<tr><th colspan="4">${esc(MANCHES[s.m])}</th></tr>`; lastM = s.m; }
    rows += `<tr><td>${k + 1}</td><td><b>${esc(s.label)}</b>${s.warn ? '<br>⚠ ' + esc(s.warn) : ''}</td><td>${esc(s.ans || '')}<br><i>${esc(s.by || '')}</i></td><td>${esc(s.tip || '')}</td></tr>`;
  });
  $('#fichebody').innerHTML = `
    <div class="fiche-actions"><button class="btn" data-act="console" type="button">Retour à la console</button><button class="btn ghost" data-act="print" type="button">Imprimer (ou Ctrl+P)</button></div>
    <h1>Manon, 30 ans : fiche animateur</h1>
    <p>Toutes les réponses dans l’ordre du jeu, avec la source de chaque anecdote (jamais affichée à l’écran). À garder sous la main si l’écran est dupliqué.</p>
    <table><thead><tr><th>#</th><th>Diapo</th><th>Réponse et source</th><th>Consigne</th></tr></thead><tbody>${rows}</tbody></table>
    <h2>Volontairement non utilisé</h2>
    <ul><li>« Quand elle a bu, elle devient très tactile » (Fanny et Jm).</li><li>« Manon adore les hot stories » (Mathilde).</li><li>« De pas faire ses pédicures » (Maëlle) et « Blagues de beauf » (Julie et Florian).</li></ul>
    <h2>Encore à compléter</h2>
    <ul><li>L’histoire du melon charentais (seul le titre est connu).</li>
    <li>La vidéo du DAB d’Eloïse, non intégrée au jeu.</li>
    <li>Les photos de Mathilde (châteaux) et de Jeremie : pas encore intégrées.</li>
    <li>Aucune réponse du conjoint pour l’instant.</li></ul>`;
}

/* =====================================================================
   Vues, clavier, événements
   ===================================================================== */
function setView(v) {
  view = v;
  document.body.dataset.view = v;
  if (v === 'stage') {
    if (!pubStage) { pubStage = makeStage($('#pubhost')); if (window.ResizeObserver) new ResizeObserver(() => fit($('#pubhost'), pubStage)).observe($('#pubhost')); }
    pubStage._key = null;
    $('#peek').hidden = true;
    requestAnimationFrame(() => fit($('#pubhost'), pubStage));
  }
  if (v === 'console') { if (pvStage) pvStage._key = null; requestAnimationFrame(() => fit($('#pv'), pvStage)); }
  if (v === 'fiche') buildFiche();
  try { if (room) room.presence({ role: v }).catch(() => {}); } catch (e) {}
  try { if (bc) bc.postMessage({ t: 'alive', role: v }); } catch (e) {}
  refresh(); updateStatus();
}
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') advance();
  else if (a === 'prev') back();
  else if (a === 'skip') skip();
  else if (a === 'all') revealAll();
  else if (a === 'go') goTo(+b.dataset.i);
  else if (a === 'stage') setView('stage');
  else if (a === 'console') setView('console');
  else if (a === 'fiche') setView('fiche');
  else if (a === 'print') { try { window.print(); } catch (err) {} }
  else if (a === 'full') toggleFull();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (view === 'fiche') { if (e.key === 'Escape') setView('console'); return; }
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Enter' || k === 'PageDown') {
    if (k === ' ' || k === 'Enter') { if (tag === 'button') return; }
    e.preventDefault(); advance();
  }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
  else if (k === 'Home') { e.preventDefault(); goTo(0); }
  else if (k.toLowerCase() === 's') skip();
  else if (k.toLowerCase() === 'r') revealAll();
  else if (k.toLowerCase() === 'f') toggleFull();
  else if (k.toLowerCase() === 'a' && view === 'stage') { const pk = $('#peek'); pk.hidden = !pk.hidden; refresh(); }
  else if (k === 'Escape' && view === 'stage') setView('console');
});

/* ---------- Démarrage ---------- */
buildConsole();
initSync();
setView('console');

})();
</script>
</body>
</html>
